<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hangman Game</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap");
* { margin: 0; padding: 0; box-sizing: border-box; font-family: "Open Sans", sans-serif; }
body {
    display: flex; padding: 0 10px; align-items: center; justify-content: center;
    min-height: 100vh;
    background-image: url(https://t4.ftcdn.net/jpg/03/42/35/51/360_F_342355187_rpMOGIXuSPn7dUGt2ZszGV6DqjdC6nCn.jpg);
    background-repeat: no-repeat; background-size: cover; background-attachment: fixed;
}
.container {
    display: flex; width: 850px; max-width: 95vw; gap: 40px; padding: 40px;
    background: #fff; border-radius: 10px; align-items: flex-end;
    justify-content: space-between; box-shadow: 0 10px 20px rgba(0,0,0,0.1);
}
.hangman-box img { user-select: none; max-width: 240px; }
.hangman-box h1 { font-size: 1.3rem; text-align: center; margin-top: 20px; text-transform: uppercase; }
.game-box .word-display { gap: 10px; list-style: none; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; }
.word-display .letter { width: 26px; font-size: 1.8rem; text-align: center; font-weight: 600; margin-bottom: 30px; text-transform: uppercase; border-bottom: 3px solid #000; }
.word-display .letter.guessed { margin: -30px 0 25px; border-color: transparent; }
.game-box h4 { text-align: center; font-size: 1rem; font-weight: 500; margin-bottom: 15px; }
.game-box h4 b { font-weight: 600; }
.game-box .guesses-text b { color: #ff0000; }
.game-box .keyboard { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 30px; justify-content: center; }
:where(.game-modal, .keyboard) button { color: #fff; border: none; outline: none; cursor: pointer; font-size: 0.9rem; font-weight: 600; border-radius: 4px; text-transform: uppercase; background: midnightblue; }
.keyboard button { padding: 7px; width: calc(100% / 9 - 5px); }
.keyboard button[disabled] { pointer-events: none; opacity: 0.6; }
:where(.game-modal, .keyboard) button:hover { background: rgb(2, 2, 44); }
.game-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 0 10px; transition: opacity 0.4s ease; }
.game-modal.show { opacity: 1; pointer-events: auto; transition: opacity 0.4s 0.4s ease; }
.game-modal .content { padding: 30px; max-width: 380px; width: 100%; border-radius: 10px; background: #fff; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
.game-modal img { max-width: 120px; margin-bottom: 20px; }
.game-modal h4 { font-size: 1.4rem; }
.game-modal p { font-size: 1.05rem; margin: 15px 0 25px; font-weight: 500; }
.game-modal p b { color: #1e204e; font-weight: 600; }
.game-modal button { padding: 12px 23px; }
@media (max-width: 782px) {
    .container { flex-direction: column; padding: 25px 15px; align-items: center; }
    .hangman-box img { max-width: 180px; }
    .hangman-box h1 { display: none; }
}
</style>
</head>
<body>
    <div class="game-modal">
        <div class="content">
            <img src="#" alt="gif">
            <h4>Game Over!</h4>
            <p>The correct word was: <b></b></p>
            <button class="play-again">Play Again</button>
        </div>
    </div>
    <div class="container">
        <div class="hangman-box">
            <img src="images/hangman-0.svg" draggable="false" alt="hangman-img">
            <h1>Hangman Game</h1>
        </div>
        <div class="game-box">
            <ul class="word-display"></ul>
            <h4 class="hint-text">Hint: <b></b></h4>
            <h4 class="guesses-text">Incorrect guesses: <b></b></h4>
            <div class="keyboard"></div>
        </div>
    </div>

<script>
const wordList = [
    { word: "socialengineering", hint: "A tactic used by attackers to manipulate individuals into divulging confidential information or performing actions." },
    { word: "zerodayattack", hint: "A cyberattack that exploits a previously unknown vulnerability in software or hardware, before the developer can issue a fix." },
    { word: "malware", hint: "Software designed to disrupt, damage, or gain unauthorized access to computer systems or data." },
    { word: "ransomware", hint: "A type of malware that encrypts files or systems and demands payment in exchange for decryption." },
    { word: "phishing", hint: "A fraudulent attempt to obtain sensitive information by disguising oneself as a trustworthy entity in electronic communications." },
    { word: "strongpassword", hint: "A password that is complex and difficult to guess, usually containing a mix of letters, numbers, and symbols." },
    { word: "spearphishing", hint: "A targeted phishing attack aimed at a specific individual or organization, often using personalized information." },
    { word: "smishing", hint: "A type of phishing attack that uses SMS text messages to trick individuals into revealing personal information." },
    { word: "zerodayexploit", hint: "An exploit that takes advantage of a zero-day vulnerability in software or hardware." },
    { word: "phishingemail", hint: "An email that uses deceptive tactics to trick recipients into disclosing sensitive information or clicking on malicious links." },
    { word: "passwordmanager", hint: "A tool that helps users generate, store, and manage complex passwords securely." },
    { word: "socialengineeringattack", hint: "A scheme where attackers manipulate people into providing confidential information or performing certain actions." },
    { word: "phishingattempt", hint: "An attempt to deceive individuals into divulging sensitive information by masquerading as a trustworthy source." }
];

const wordDisplay = document.querySelector(".word-display");
const guessesText = document.querySelector(".guesses-text b");
const keyboardDiv = document.querySelector(".keyboard");
const hangmanImage = document.querySelector(".hangman-box img");
const gameModal = document.querySelector(".game-modal");
const playAgainBtn = gameModal.querySelector(".play-again");

let currentWord, correctLetters, wrongGuessCount;
const maxGuesses = 6;

const resetGame = () => {
    correctLetters = [];
    wrongGuessCount = 0;
    hangmanImage.src = "images/hangman-0.svg";
    guessesText.innerText = `${wrongGuessCount} / ${maxGuesses}`;
    wordDisplay.innerHTML = currentWord.split("").map(() => `<li class="letter"></li>`).join("");
    keyboardDiv.querySelectorAll("button").forEach(btn => btn.disabled = false);
    gameModal.classList.remove("show");
}

const getRandomWord = () => {
    const { word, hint } = wordList[Math.floor(Math.random() * wordList.length)];
    currentWord = word;
    document.querySelector(".hint-text b").innerText = hint;
    resetGame();
}

// Reports the result to the parent React page (games/[id]/page.tsx),
// which owns auth + calls the real save-score API. Replaces the old
// PHP save_game_log.php fetch call.
const reportResult = (isVictory, score) => {
    if (window.parent) {
        window.parent.postMessage({
            type: 'GAME_OVER',
            game: 'hangman',
            score,
            won: isVictory
        }, '*');
    }
};

const gameOver = (isVictory) => {
    const modalText = isVictory ? `You found the word:` : 'The correct word was:';
    gameModal.querySelector("img").src = `images/${isVictory ? 'victory' : 'lost'}.gif`;
    gameModal.querySelector("h4").innerText = isVictory ? 'Congratulations!' : 'Game Over!';
    gameModal.querySelector("p").innerHTML = `${modalText} <b>${currentWord}</b>`;
    gameModal.classList.add("show");

    const score = isVictory ? Math.max(100 - (wrongGuessCount * 10), 10) : 0;
    reportResult(isVictory, score);
};

const initGame = (button, clickedLetter) => {
    if (currentWord.includes(clickedLetter)) {
        [...currentWord].forEach((letter, index) => {
            if (letter === clickedLetter) {
                correctLetters.push(letter);
                wordDisplay.querySelectorAll("li")[index].innerText = letter;
                wordDisplay.querySelectorAll("li")[index].classList.add("guessed");
            }
        });
    } else {
        wrongGuessCount++;
        hangmanImage.src = `images/hangman-${wrongGuessCount}.svg`;
    }
    button.disabled = true;
    guessesText.innerText = `${wrongGuessCount} / ${maxGuesses}`;

    if (wrongGuessCount === maxGuesses) return gameOver(false);
    if (correctLetters.length === currentWord.length) return gameOver(true);
}

for (let i = 97; i <= 122; i++) {
    const button = document.createElement("button");
    button.innerText = String.fromCharCode(i);
    keyboardDiv.appendChild(button);
    button.addEventListener("click", (e) => initGame(e.target, String.fromCharCode(i)));
}

getRandomWord();
playAgainBtn.addEventListener("click", getRandomWord);
</script>
</body>
</html>
