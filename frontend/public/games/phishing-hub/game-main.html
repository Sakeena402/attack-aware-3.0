<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Back to Games</title>
</head>
<body>
<script>
  // The legacy games menu is now the real React games list.
  // Any link that used to point here sends the whole browser
  // (not just the iframe) back to it.
  if (window.top) {
    window.top.location.href = '/dashboard/games';
  } else {
    window.location.href = '/dashboard/games';
  }
</script>
</body>
</html>
