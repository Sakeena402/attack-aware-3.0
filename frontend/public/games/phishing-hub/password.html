<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8" />
  <title>Password Validation Check</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css" />
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@500&display=swap");
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Outfit", sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-image: url(https://cdn.ttgtmedia.com/rms/onlineimages/keys_a280346470.jpg);
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
    }
    .password-container {
      width: 450px;
      overflow: hidden;
      padding: 28px;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
    }
    .password-container .password-field {
      height: 65px;
      width: 100%;
      position: relative;
    }
    .password-field input {
      width: 100%;
      height: 100%;
      outline: none;
      padding: 0 17px;
      font-size: 1.3rem;
      border-radius: 5px;
      border: 1px solid #999;
    }
    .password-field input:focus {
      padding: 0 16px;
      border: 2px solid #4285f4;
    }
    .password-field i {
      right: 18px;
      top: 50%;
      font-size: 1.2rem;
      color: #999;
      cursor: pointer;
      position: absolute;
      transform: translateY(-50%);
    }
    .password-container .content {
      margin: 20px 0 10px;
    }
    .content p {
      color: #333;
      font-size: 1.3rem;
    }
    .content .requirement-list {
      margin-top: 20px;
    }
    .requirement-list li {
      font-size: 1.3rem;
      list-style: none;
      display: flex;
      align-items: center;
      margin-bottom: 15px;
      opacity: 0.5; /* Initially set opacity to 0.5 */
    }
    .requirement-list li i {
      width: 20px;
      color: #aaa;
      font-size: 0.6rem;
    }
    .requirement-list li.valid i {
      font-size: 1.2rem;
      color: #4285f4;
      animation: fadeInOut 0.5s ease;
    }
    .requirement-list li span {
      margin-left: 12px;
      color: #333;
    }
    .requirement-list li.valid span {
      color: #999;
    }
    .meter {
      height: 10px;
      margin-top: 10px;
      background-color: #ddd;
      border-radius: 5px;
      position: relative;
    }
    .meter > span {
      display: block;
      height: 100%;
      border-radius: 5px;
      transition: width 0.3s ease;
    }
    .meter > span.weak {
      background-color: #f44336;
    }
    .meter > span.medium {
      background-color: rgb(255, 193, 7);
    }
    .meter > span.strong {
      background-color: #4caf50;
    }
    .complexity-level {
      font-size: 1.3rem;
      margin-top: 10px;
      color: steelblue;
    }
    .game-controls button {
  margin-right: 10px;
  padding: 10px 20px;
  font-size: 1.2rem;
  border: none;
  border-radius: 5px;
  background-color: #4285f4;
  color: #fff;
  cursor: pointer;
}
.game-controls {
  display: none; /* Initially hide the game controls */
  margin-top: 20px;
  justify-content: center; /* Center the buttons horizontally */
}

.game-controls button:hover {
  background-color: #0055a5;
}


    @media screen and (max-width: 500px) {
      body,
      .password-container {
        padding: 15px;
      }
      .password-container .password-field {
        height: 55px;
      }
      .password-field input,
      .content p {
        font-size: 1.15rem;
      }
      .password-field i,
      .requirement-list li {
        font-size: 1.1rem;
      }
      .requirement-list li span {
        margin-left: 7px;
      }
    }
  </style>
</head>

<body>
  <div class="password-container">
    <div class="password-field">
      <input type="password" id="password" placeholder="Create password" />
      <i class="fa-solid fa-eye" id="togglePassword"></i>
    </div>
    <div class="content">
      <p>Password must contain:</p>
      <ul class="requirement-list">
        <li id="minLength">
          <i class="fa-solid fa-circle"></i>
          <span>At least 8 characters length</span>
        </li>
        <li id="hasNumber">
          <i class="fa-solid fa-circle"></i>
          <span>At least 1 number (0...9)</span>
        </li>
        <li id="hasLowerCase">
          <i class="fa-solid fa-circle"></i>
          <span>At least 1 lowercase letter (a...z)</span>
        </li>
        <li id="hasSpecialChar">
          <i class="fa-solid fa-circle"></i>
          <span>At least 1 special character (!...$)</span>
        </li>
        <li id="hasUpperCase">
          <i class="fa-solid fa-circle"></i>
          <span>At least 1 uppercase letter (A...Z)</span>
        </li>
      </ul>
      <p id="passwordStrength"></p> <!-- Added message element -->
      <div class="meter">
        <span id="strengthMeter"></span>
      </div>
      <div class="complexity-level" id="complexityLevel"></div> <!-- Added complexity level display -->
      <div class="game-controls"> <!-- Added game controls container -->
        <a href="easy_game.html"><button id="backButton" style="display: none;">Quit</button></a>
      </div>
    </div>

    <script>
const passwordInput = document.getElementById("password");
const eyeIcon = document.getElementById("togglePassword");
const requirementList = document.querySelectorAll(".requirement-list li");
const passwordStrengthMsg = document.getElementById("passwordStrength");
const strengthMeter = document.getElementById("strengthMeter");
const complexityLevelDisplay = document.getElementById("complexityLevel");
const backButton = document.getElementById("backButton");
const nextButton = document.getElementById("nextButton");

const requirements = [
  { regex: /.{8,}/, index: 0, message: "Minimum of 8 characters" },
  { regex: /[0-9]/, index: 1, message: "At least one number (0...9)" },
  { regex: /[a-z]/, index: 2, message: "At least one lowercase letter (a...z)" },
  { regex: /[^A-Za-z0-9]/, index: 3, message: "At least one special character (!...$)" },
  { regex: /[A-Z]/, index: 4, message: "At least one uppercase letter (A...Z)" }
];

passwordInput.addEventListener("input", (e) => {
  let isValidPassword = true;
  let strength = 0;
  requirements.forEach((item) => {
    const isValid = item.regex.test(e.target.value);
    const requirementItem = requirementList[item.index];
    if (isValid) {
      requirementItem.classList.add("valid");
      requirementItem.firstElementChild.className = "fa-solid fa-check";
      requirementItem.style.opacity = "1";
      strength++;
    } else {
      requirementItem.classList.remove("valid");
      requirementItem.firstElementChild.className = "fa-solid fa-circle";
      requirementItem.style.opacity = "0.5";
      isValidPassword = false;
    }
  });

  let meterClass = "";
  if (strength === 5) {
    meterClass = "strong";
    passwordStrengthMsg.textContent = "Your password is strong!";
    passwordStrengthMsg.style.color = "#4caf50";
    document.querySelector(".game-controls").style.display = "flex";

    // ✅ Save log in DB when password is strong
    fetch("save_game_log.php", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: `game_title=PasswordValidation&score=100`
    })
    .then(res => res.text())
    .then(data => console.log("Log saved:", data))
    .catch(err => console.error("Error saving log:", err));

  } else if (strength >= 3) {
    meterClass = "medium";
    passwordStrengthMsg.textContent = "Your password is moderate";
    passwordStrengthMsg.style.color = "#ffc107";
    document.querySelector(".game-controls").style.display = "none";
  } else {
    meterClass = "weak";
    passwordStrengthMsg.textContent = "Your password is weak!";
    passwordStrengthMsg.style.color = "#f44336";
    document.querySelector(".game-controls").style.display = "none";
  }
  strengthMeter.setAttribute("class", meterClass);

  let complexityLevel = "";
  if (strength === 5) {
    complexityLevel = "Advanced";
  } else if (strength >= 3) {
    complexityLevel = "Moderate";
  } else {
    complexityLevel = "Basic";
  }
  complexityLevelDisplay.textContent = `Password Complexity Level: ${complexityLevel}`;

  if (isValidPassword) {
    backButton.style.display = "inline-block";
    nextButton.style.display = "inline-block";
  } else {
    backButton.style.display = "none";
    nextButton.style.display = "none";
  }
});

eyeIcon.addEventListener("click", () => {
  const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
  passwordInput.setAttribute("type", type);
  eyeIcon.className = `fa-solid fa-eye${type === "password" ? "" : "-slash"}`;
});
</script>

  </div>
</body>

</html>
