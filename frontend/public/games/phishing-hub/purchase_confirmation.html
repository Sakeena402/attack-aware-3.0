<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Payment Gateway</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.0.3/css/font-awesome.css">
    <style>
        .page-header {
            margin: 140px 0 20px;
        }
        .container {
            margin-left: -20px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="page-header text-center">
        <h1> Payment - $</h1>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-xs-12 col-md-6 col-md-offset-4">
                <div class="panel panel-default">
                    <div class="panel-heading">
                        <h3 class="text-center">Payment Details</h3>
                    </div>
                    <div class="panel-body">
                        <form role="form" id="paymentForm">
                            <div class="form-group">
                                <label>CARD NUMBER</label>
                                <div class="input-group">
                                    <input type="tel" class="form-control" placeholder="Valid Card Number" required />
                                    <span class="input-group-addon"><span class="fa fa-credit-card"></span></span>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>EXPIRATION DATE</label>
                                <input type="tel" class="form-control" placeholder="MM / YY" required />
                            </div>
                            <div class="form-group">
                                <label>CV CODE</label>
                                <input type="tel" class="form-control" placeholder="CVC" required />
                            </div>
                            <div class="form-group">
                                <label>CARD OWNER</label>
                                <input type="text" class="form-control" placeholder="Card Owner Name" required />
                            </div>
                        </form>
                    </div>
                    <div class="panel-footer">
                        <button class="btn btn-success btn-lg btn-block" onclick="confirmPayment()">Confirm Payment</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.0/js/bootstrap.min.js"></script>

<script>
// JavaScript function to handle the payment confirmation and redirection
function confirmPayment() {
    // Validate form inputs if necessary
    var form = document.getElementById('paymentForm');
    if (form.checkValidity()) {
        // Trigger the database update and show a success message
        var selectedPlan = '';
        var planAmount = '';
        var email = '';

        // AJAX request to update the database
        $.ajax({
            url: 'update_package.php', // Create a separate file to handle database update
            type: 'POST',
            data: {
                email: email,
                package_name: selectedPlan,
                amount_paid: planAmount
            },
            success: function(response) {
                // On success, show an alert and redirect the user
                alert('You have purchased package successfully!');

                // Redirect to the home page after successful payment
                window.location.href = '../Cybershield Home.html';  // Replace 'home.php' with your homepage file
            },
            error: function() {
                alert('Error saving package information');
            }
        });
    } else {
        // Highlight missing or invalid fields
        form.reportValidity();
    }
}
</script>

</body>
</html>
