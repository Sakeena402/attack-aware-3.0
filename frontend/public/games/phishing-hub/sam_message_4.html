<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hint of level 1</title>
    <link rel="icon" href="assets/favicon.png" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Changa:wght@300&family=Gluten&display=swap");

      body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-size: 16px;
        background-color: #000;
        overflow: hidden;
        background-image: url(https://img.pikbest.com/backgrounds/20200530/blue-black-abstract-background-gradient-v_1773608jpg!sw800);
    background-repeat: no-repeat;
    background-size: cover;
    background-attachment: fixed;
      }

      .hint-container {
        width: 90%;
        max-width: 600px;
        padding: 20px;
      }

      img {
        max-width: 100%;
        height: auto;
        display: block;
        margin: 0 auto;
        border: 2px solid #f5f5f5;
        border-radius: 20px;
      }

      h1 {
        font-family: "Gluten", cursive;
        color: yellow;
        font-size: 24px;
        margin-top: 10px;
      }

      p {
        font-family: "Changa", sans-serif;
        color: #f5f5f5;
        font-size: 18px;
        margin-top: 10px;
      }

      @import url("https://fonts.googleapis.com/css2?family=VT323&display=swap");

      #intro {
        color: white;
        font-family: "VT323", monospace;
      }

      .center-center {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%);
      }

      [class*="btn-glitch-"] {
        display: inline-block;
        font-family: "VT323", monospace;
        border: 1px solid white;
        border-radius: 10px;
        color: white;
        padding: 10px 13px;
        min-width: 175px;
        line-height: 1.5em;
        white-space: no-wrap;
        text-transform: uppercase;
        cursor: pointer;
        .text,
        .decoration {
          display: inline-block;
        }
        .decoration {
          display: inline-block;
          float: right;
        }
        &:hover,
        &:focus {
          animation-name: glitch;
          animation-duration: 0.2s;
          background-color: yellow;
          color: black;
          border: 1px solid yellow;
          .text-decoration {
            animation-name: blink;
            animation-duration: 0.1s;
            animation-iteration-count: infinite;
          }
          .decoration {
            animation-name: blink;
            animation-duration: 0.1s;
            animation-iteration-count: infinite;
          }
          :before {
            content: " ";
            width: 15px;
            border: 1px solid black;
            position: absolute;
            right: 25%;
            bottom: 3px;
            transform: rotate(35deg);
          }
          :after {
            animation-name: shrink;
            animation-duration: 0.5s;
            animation-iteration-count: 1;
            animation-fill-mode: forwards;
            content: " ";
            width: 75%;
            border: 1px solid black;
            position: absolute;
            left: 0;
            bottom: 5px;
          }
        }
        &:active {
          background: none;
          color: yellow;
          .text-decoration {
            animation-name: none;
          }
          .decoration {
            animation-name: none;
          }
          :before,
          :after {
            display: none;
          }
        }
      }

      @keyframes glitch {
        25% {
          background-color: red;
          transform: translateX(-10px);
          letter-spacing: 10px;
        }
        35% {
          background-color: green;
          transform: translate(10px);
        }
        59% {
          opacity: 0;
        }
        60% {
          background-color: blue;
          transform: translate(-10px);
          filter: blur(5px);
        }
        100% {
          background-color: yellow;
          blur: (5px);
        }
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      @keyframes shrink {
        100% {
          width: 10%;
        }
      }
    </style>
  </head>
  <body>
    <div class="hint-container">
      <img
        rel="preload"
        loading="eager"
        decoding="async"
        fetchpriority="high"
        width="1280px"
        height="720px"
        src="assets/sam_message_4.jpg"
        alt="hint"
      />
      <h1>SAM :</h1>
      <p>Try the link, you will also get the free voucher 😊</p>
      <a id="playButton" href="amazon.html" class="btn-glitch-fill">
        <span class="text">Next</span><span class="text-decoration">_</span
        ><span class="decoration">&rArr;</span>
      </a>
    </div>
  </body>
</html>
